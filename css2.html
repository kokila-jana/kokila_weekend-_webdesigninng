<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a
        {
            width: 100vw;
            height: 100vh;
            border: 2px solid;
            display: flex;
            gap: 20px;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
        }
        div
        {
             width: 300px;
            height: 400px;
             background-position: center;
            background-size: cover;
        }
        .b
        {
           
            background-image: url(10001.jpg);
           
        }
         .c
        {
            background-image: url(10002.jpg);
        }

         .d
        {
            background-image: url(10003.jpg);
        }

         .e
        {
            background-image: url(10004.jpg);
        }

         .f
        {
           
            background-image: url(10005.jpg);
           
        }
         .g
        {
           
            background-image: url(10006.jpg);
        
        }
    </style>
</head>
<body>
    <div class="a">
        <div class="b"></div>
        <div class="c"></div>
        <div class="d"></div>
        <div class="e"></div>
        <div class="f"></div>
        <div class="g"></div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul
        {
            list-style-type: none;

        }
        a{
            text-decoration: none;
            margin-left: 20px;
        }
        li
        {
            /* display: inline; */
            /* display: block; */
            display: inline-block;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="">Home</a></li>
            <li><a href="">Course</a></li>
            <li><a href="">Galary</a></li>
            <li><a href="">About Us </a></li>
            <li><a href="">Contact Us</a></li>
        </ul>
    </nav>
</body>
</html>
